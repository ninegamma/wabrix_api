[package]
name = "wabrix_api"
version = "0.7.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
network-types = { version = "0.2", default-features = false, features = ["zerocopy"] }
zerocopy = { git = "https://github.com/google/zerocopy", default-features = false, features = ["derive"] }
byteorder = { version = "1.5.0", default-features = false }
fnv = { version = "1.0.7", default-features = false }
hashbrown = { version = "0.17.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }

[lib]
name = "wabrix_api"
path = "src/lib.rs"

[features]
default = []
# The special feature flag reserved for the Host application
host = []

[patch.crates-io]
network-types = { git = "https://github.com/ninegamma/network-types.git", branch = "zerocopy" }
