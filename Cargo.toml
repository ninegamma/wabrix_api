[workspace]
resolver = "2"
members = [
    "wabrix_api",
    "plugins/tcp_engine",
    "plugins/generator_plugin",
    "plugins/filter_engine",
    "plugins/generator_engine",
    "plugins/inspector_engine",
#    "plugins/inspector_engine_new",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wabrix_api = { path = "wabrix_api" }
wit-bindgen = "0.54"
spin = "0.10"
anyhow = "1"
macaddr = { version = "1.0.1", default-features = false, features = ["serde"] }
network-types = { version = "0.2", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
