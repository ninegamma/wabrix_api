[workspace]
resolver = "2"
members = [
    "wabrix_api",
    "plugins/tcp_engine",
    "plugins/generator_plugin", "plugins/filter_engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wabrix_api = { path = "wabrix_api" }
wit-bindgen = "0.54"
spin = "0.10"
anyhow = "1"
macaddr = { version = "1.0.1", default-features = false, features = ["serde"] }
network-types = { version = "0.2", default-features = false }
